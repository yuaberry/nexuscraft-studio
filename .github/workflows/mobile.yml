name: Mobile

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/core/**", "pnpm-lock.yaml"]
  pull_request:
    paths: ["apps/mobile/**", "packages/core/**"]

jobs:
  mobile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (mobile + core)
        run: pnpm install --frozen-lockfile --filter @voxel/mobile

      - name: Typecheck the mobile app
        run: pnpm --filter @voxel/mobile typecheck

      - name: Shared core tests
        run: pnpm install --frozen-lockfile --filter voxel --filter @voxel/core --filter @voxel/mobile && pnpm exec vitest run packages/core
