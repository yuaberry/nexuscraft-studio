name: Mobile builds

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

jobs:
  android-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install (mobile + core, hoisted layout)
        run: pnpm install --frozen-lockfile --filter @voxel/mobile

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild (natives) + pnpm workspace patches
        run: pnpm prebuild:android
        working-directory: apps/mobile

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOXEL-mobile-android
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "VOXEL-mobile-${GITHUB_REF_NAME#mobile-v}-android.apk" && gh release upload "${GITHUB_REF_NAME#mobile-v}" "VOXEL-mobile-${GITHUB_REF_NAME#mobile-v}-android.apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios-archive:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (mobile + core, hoisted layout)
        run: pnpm install --frozen-lockfile --filter @voxel/mobile

      - name: Prebuild iOS natives (incl. pod install)
        run: pnpm prebuild:ios
        working-directory: apps/mobile

      - name: Archive (unsigned — sign with your Apple certs afterwards)
        run: |
          xcodebuild -workspace ios/*.xcworkspace \
            -scheme VOXEL \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VOXEL.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
        working-directory: apps/mobile

      - name: Zip archive
        run: |
          cd apps/mobile/build
          zip -qry VOXEL-ios-unsigned.xcarchive.zip VOXEL.xcarchive

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOXEL-mobile-ios-unsigned
          path: apps/mobile/build/VOXEL-ios-unsigned.xcarchive.zip
